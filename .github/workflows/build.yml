name: Build hydro preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hydro-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load approved template assets
        run: |
          git clone --depth 1 https://github.com/ItsJavierLomelin/riverside-hydro-site-template.git /tmp/assets
          cp -r /tmp/assets/public .
          python3 -m pip install Pillow
          python3 - <<'IMAGES'
          from PIL import Image
          from pathlib import Path
          for p in Path('public').rglob('*'):
              if p.suffix.lower() in ['.jpg','.jpeg','.png']:
                  im=Image.open(p).convert('RGB');im.thumbnail((1200,1000));im.save(p.with_suffix('.webp'),'WEBP',quality=78);p.unlink()
          IMAGES
      - name: Materialize reviewed site source
        run: |
          python3 - <<'PYCODE'
          import base64,io,tarfile
          tarfile.open(fileobj=io.BytesIO(base64.b64decode('')),mode='r:gz').extractall('.',filter='data')
          PYCODE
      - name: Save site source on main
        run: |
          git config user.name 'ItsJavierLomelin'
          git config user.email 'noreply@github.com'
          git add src public city.config.mjs astro.config.mjs package.json package-lock.json README.md
          git diff --cached --quiet || (git commit -m 'Add researched hydro satellite site source' && git push)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          BASE: /rittman-hydro-jetting-pros
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
